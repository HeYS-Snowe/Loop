# Flutter Launcher Icons 配置
# 文档: https://pub.dev/packages/flutter_launcher_icons
#
# 生成命令:
#   dart run flutter_launcher_icons
#
# 图标源文件: assets/icon/app_icon.png (2048x2048)
# 生成目标: android/app/src/main/res/mipmap-*

flutter_launcher_icons:
  # 源图标路径 (建议 1024x1024 或更大, PNG)
  image_path: "assets/icon/app_icon.png"

  # Android 配置
  android: true
  min_sdk_android: 23  # 匹配项目 minSdkVersion (API 23 / Android 6.0)

  # iOS 配置 (本项目仅面向 Android, 关闭以避免生成无用资源)
  ios: false

  # Android 自适应图标 (Adaptive Icon, Android 8.0+)
  # 背景: 纯黑 (与新图标源文件背景一致, 避免白色背景割裂视觉)
  # 前景: 使用源图标 (已包含充足内边距, 适配自适应图标遮罩裁剪)
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  # 关闭 web 和桌面平台
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
